refresh_rate: 30 seconds
appenders:
  stdout:
    kind: console
    encoder:
      pattern: "[{d(%Y-%m-%dT%H:%M:%S%.3f)} {h({l}):<5.5} {T} {M}] {m}{n}"
  requests:
    kind: file
    path: "log/running.log"
    encoder:
      # d-时间 l-日志级别 T-线程 M-模块名 m-消息 n-换行
      # 详细文档： https://docs.rs/log4rs/latest/log4rs/encode/pattern/index.html#formatters
      pattern: "[{d(%Y-%m-%dT%H:%M:%S%.3f)} {h({l}):<5.5} {T} {M}] {m}{n}"
root:
  level: info
  appenders:
    - stdout
    - requests
