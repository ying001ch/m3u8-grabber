[package]
name = "M3u8-Grabber"
version = "0.3.0"
description = "a m3u8 video downloader by Rust"
authors = ["frank"]
license = ""
repository = ""
default-run = "M3u8-Grabber"
edition = "2021"
rust-version = "1.70"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[workspace]
members = [
    ".",
    "db-derive"
]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2", features = ["tray-icon"] }
# reqwest = { version = "0.11.18", features = ["blocking"] }
aes = "0.7.4"
block-modes = "0.8.1"
bytes = "1.4.0"
tokio = {version = "1.28.1", features = ["full"] }
anyhow = { version = "1.0"}
base64= { version = "0.21.0" }
lazy_static="1.4.0"
once_cell = "1.20.2"
log = "0.4"
log4rs = "1.3.0"
m3u8-rs = "6.0.0"
sqlx = {version="0.8.3",features = [ "sqlite", "runtime-tokio", "tls-rustls-ring-webpki" ] }
sqlx-sqlite = {version = "0.8.3", features = [ "bundled" ] }
db-derive = {path = "./db-derive"}

[dependencies.reqwest]
version = "0.12.4"
default-features = false
# 使用rustls证书，内置证书库可能不全，出现证书错误
features = ["charset", "blocking", "rustls-tls"]

[features]
# this feature is used for production builds or when `devPath` points to the filesystem and the built-in dev server is disabled.
# If you use cargo directly instead of tauri's cli you can use this feature flag to switch between tauri's `dev` and `build` modes.
# DO NOT REMOVE!!
custom-protocol = [ "tauri/custom-protocol" ]

[profile.release]
panic = "abort" # Strip expensive panic clean-up logic
codegen-units = 1 # Compile crates one after another so the compiler can optimize better
lto = true # Enables link to optimizations
opt-level = "s" # Optimize for binary size
strip = true # Remove debug symbols
